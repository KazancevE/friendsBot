services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daddyson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daddyson}
      POSTGRES_DB: ${POSTGRES_DB:-daddyson}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daddyson} -d ${POSTGRES_DB:-daddyson}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://daddyson:daddyson@postgres:5432/daddyson}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      VENUE_TIMEZONE: ${VENUE_TIMEZONE:-Asia/Barnaul}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TELEGRAM_TRANSPORT: ${TELEGRAM_TRANSPORT:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_URL: ${MAX_BOT_URL:-}
      MAX_ADMIN_USER_ID: ${MAX_ADMIN_USER_ID:-}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-daddyson-demo}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-daddyson-demo-session}
      ALLOW_DEMO_GUEST: ${ALLOW_DEMO_GUEST:-true}
    volumes:
      - uploads_data:/app/uploads

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      PORT: 3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uploads_data:
